<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c8cff"/>
      <stop offset="1" stop-color="#a46cff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2040"/>
      <stop offset="1" stop-color="#0b0d1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <!-- rabbit-ear antenna -->
  <path d="M256 168 L178 76 M256 168 L334 76" stroke="#fff" stroke-width="20" stroke-linecap="round"/>
  <circle cx="178" cy="76" r="17" fill="#fff"/>
  <circle cx="334" cy="76" r="17" fill="#fff"/>
  <!-- the set -->
  <rect x="86" y="160" width="340" height="250" rx="54" fill="#fff"/>
  <rect x="118" y="190" width="276" height="190" rx="32" fill="url(#screen)"/>
  <!-- feet -->
  <path d="M168 410 L150 440 M344 410 L362 440" stroke="#fff" stroke-width="20" stroke-linecap="round"/>
  <!-- play glyph -->
  <path d="M236 245 L236 325 L302 285 Z" fill="#8fa5ff" stroke="#8fa5ff" stroke-width="10" stroke-linejoin="round"/>
</svg>
